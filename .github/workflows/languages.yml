name: Languages card

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - languages.config.json
      - scripts/languages/**
      - .github/workflows/languages.yml

permissions:
  contents: write

concurrency:
  group: languages-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: node --test scripts/languages/
      - name: Build cards
        env:
          # The default GITHUB_TOKEN cannot read private repos in other orgs, so a PAT is required.
          GH_TOKEN: ${{ secrets.LANGS_TOKEN }}
        run: node scripts/languages/main.mjs
      - name: Commit changed cards
        run: |
          git add assets/languages-dark.svg assets/languages-light.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update languages card"
          git push
